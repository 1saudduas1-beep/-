name: Translate SRT to Bilingual Arabic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse SRT
        run: python scripts/srt_parser.py

      - name: Build context windows
        run: python scripts/chunker.py

      # ترجمة الأسطر عبر Gemini. إذا فشلت هذه الخطوة (مثلًا بسبب ضغط مؤقت
      # على خوادم Google أو خطأ 503)، لا نوقف الـ job فورًا؛ نكمل إلى خطوة
      # حفظ التقدم أدناه حتى لا تُفقد الترجمات المنجزة حتى نقطة الفشل.
      # يدعم مفتاح Gemini واحد (GEMINI_API_KEY، للتوافق مع الإعداد
      # القديم) أو عدة مفاتيح مفصولة بفواصل (GEMINI_API_KEYS) للاستفادة
      # من تدوير المفاتيح عبر مشاريع Google منفصلة. GROQ_API_KEY اختياري
      # كخط دفاع أخير فقط لو استُنفدت كل حصص Gemini.
      - name: Translate with Gemini
        id: translate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/translator.py

      # يحفظ كل ملفات تقدّم الترجمة داخل المستودع نفسه (رغم أنها ضمن
      # .gitignore عادة) حتى لو فشلت الترجمة جزئيًا: translated.json
      # و glossary.json للترجمات والقاموس، exhausted_quota.json حتى لا
      # يُعاد تجربة تركيبات (مفتاح × موديل) معروف استنفادها اليوم بعد كل
      # إعادة تشغيل، وconflicts/groq_fallback_used للشفافية عند المراجعة.
      # هذا يسمح لك بإعادة تشغيل الـ workflow يدويًا لاحقًا فيكمل تلقائيًا
      # من النافذة التي توقف عندها بدل البدء من الصفر.
      - name: Save translation progress
        if: always()
        run: |
          git config user.name "translation-bot"
          git config user.email "actions@github.com"
          FILES="data/translated.json data/glossary.json data/exhausted_quota.json data/translation_conflicts.json data/groq_fallback_used.json"
          EXISTING=""
          for f in $FILES; do
            [ -f "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -n "$EXISTING" ]; then
            git add -f $EXISTING 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: save translation progress [skip ci]"
              git push
            else
              echo "لا يوجد تقدم جديد لحفظه."
            fi
          fi

      # إذا فشلت خطوة الترجمة فعليًا، نوقف الـ job هنا بعد حفظ التقدم،
      # حتى لا تُنفَّذ خطوات البناء والرفع على بيانات غير مكتملة.
      - name: Stop if translation failed
        if: steps.translate.outcome == 'failure'
        run: |
          echo "فشلت الترجمة. التقدم المنجز محفوظ في المستودع — أعد تشغيل الـ workflow يدويًا للمتابعة من حيث توقف."
          exit 1

      - name: Rebuild final bilingual SRT
        run: python scripts/rebuilder.py

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-srt
          path: output/*.srt

      - name: Upload glossary (for inspection/debugging)
        uses: actions/upload-artifact@v4
        with:
          name: glossary
          path: data/glossary.json

      # للمراجعة السريعة: أسطر تداخل تُرجمت بشكل مختلف بين نافذتين،
      # وأسطر تُرجمت عبر خط الدفاع الأخير (Groq) بدل Gemini. الملفان قد
      # لا يوجدا إطلاقًا في تشغيل سليم بالكامل، فالرفع اختياري (لا يفشل
      # الـ job لو غير موجودين).
      - name: Upload quality review files (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-review
          path: |
            data/translation_conflicts.json
            data/groq_fallback_used.json
          if-no-files-found: ignore
