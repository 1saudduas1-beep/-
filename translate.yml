name: Translate SRT to Bilingual Arabic

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse SRT
        run: python scripts/srt_parser.py

      - name: Build context windows
        run: python scripts/chunker.py

      - name: Translate with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translator.py

      - name: Rebuild final bilingual SRT
        run: python scripts/rebuilder.py

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-srt
          path: output/*.srt

      - name: Upload glossary (for inspection/debugging)
        uses: actions/upload-artifact@v4
        with:
          name: glossary
          path: data/glossary.json
